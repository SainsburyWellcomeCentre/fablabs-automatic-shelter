%YAML 1.1
---
# Schema: stay on draft-02. Checked 2026-09-22 with harp.toolkit 0.3.0.
# The schema files in harp-tech/protocol declare $id draft-03, but the docs
# site publishes them under draft-02, so the draft-03 URL returns 404.
# draft-03 also requires protocolVersion, which the 0.3.0 generator rejects
# as an unknown property. So draft-02 is the only combination that both
# validates and generates today.
# yaml-language-server: $schema=https://harp-tech.org/draft-02/schema/device.json
device: Automatic Shelter
whoAmI: 3300
firmwareVersion: "1.1"
hardwareTargets: "2.0"
registers:
  PosHouse1:
    address: 32
    access: Write
    type: U8
    minValue: 0
    maxValue: 255
    description: Target step for House1. 0 lowers it fully and 255 raises it fully.
  StatusHouse1:
    address: 48
    access: Event
    type: U8
    maskType: MotorStatus
    description: Reports the state of House1.
  TrqHouse1:
    address: 64
    access: Read/Write
    type: U8
    minValue: 0
    maxValue: 100
    description: Torque limit for House1.
  SpdHouse1:
    address: 80
    access: Read/Write
    type: U8
    minValue: 0
    maxValue: 200
    description: Profile velocity for House1.

  PosHouse2:
