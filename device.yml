groupMasks:
  MotorStatus:
    description: Enumerates the states reported for each motor.
    values:
      Idle: {value: 0, description: The motor is stationary and not at a known end stop.}
      Up: {value: 1, description: The motor is fully raised.}
      Down: {value: 2, description: The motor is fully lowered.}
      Moving: {value: 3, description: The motor is moving towards a target position.}
      Error: {value: 255, description: The last movement or calibration failed.}
